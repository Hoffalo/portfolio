name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          npm run dev > /tmp/portfolio-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5173 > /dev/null && break || sleep 1; done
          npm run test:browser
