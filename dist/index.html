<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111b20" />
    <title>Issam Arida — The Midnight Archive</title>
    <meta
      name="description"
      content="Explore Issam Arida’s playable pixel-art portfolio. AI, full-stack engineering, low-level systems, and interactive graphics."
    />
    <meta property="og:title" content="Issam Arida — The Midnight Archive" />
    <meta
      property="og:description"
      content="A little world of things I've built. Explore a playable developer portfolio."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <a href="mailto:issamaarida@gmail.com">issamaarida@gmail.com</a>
      </header>
      <main>
        <section class="game-frame" aria-label="Playable portfolio village">
          <div class="world-wrap">
            <canvas
              id="world"
              width="480"
              height="270"
              tabindex="0"
              aria-label="Woodland game. Walk with WASD or arrow keys, then press E or Enter at a building. You can also click a building, or Tab to one and press Enter."
            ></canvas>
            <div class="building-access" aria-label="Village buildings">
              <button
                data-area="projects"
                aria-label="Enter projects workshop"
                style="--x: 25.5%; --y: 33.1%; --w: 14.3%; --h: 20.4%"
              ></button>
              <button
                data-area="career"
                aria-label="Enter career observatory"
                style="--x: 65.3%; --y: 27%; --w: 12.1%; --h: 26.9%"
              ></button>
              <button
                data-area="gamedev"
                aria-label="Enter game development arcade"
                style="--x: 19.6%; --y: 62.8%; --w: 12.7%; --h: 18%"
              ></button>
              <button
                data-area="about"
                aria-label="Enter about cabin"
                style="--x: 67.5%; --y: 64.8%; --w: 13.9%; --h: 16.9%"
              ></button>
            </div>
            <button id="interact" class="interact" hidden>
              <kbd>E</kbd> <span>Enter</span>
            </button>
            <span id="world-status" class="sr-only" role="status"></span>
          </div>
          <div class="game-bottom">
            <div class="keyboard-hint">
              <span
                ><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd
                ><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> walk</span
              ><span
                ><kbd>E</kbd> enter <span class="hint-dot">·</span> click a
                building to visit</span
              >
            </div>
            <div class="touch-pad" aria-label="Touch movement controls">
              <button data-move="up" aria-label="Move up">▲</button
              ><button data-move="left" aria-label="Move left">◀</button
              ><button data-move="down" aria-label="Move down">▼</button
              ><button data-move="right" aria-label="Move right">▶</button>
            </div>
            <div class="game-options">
              <button
                id="sound"
                aria-pressed="false"
                aria-label="Enable ambient sound"
              >
                ♫ <span>sound off</span></button
              ><button
                id="motion"
                aria-pressed="false"
                aria-label="Reduce ambient motion"
              >
                ≈ <span>wind on</span>
              </button>
            </div>
          </div>
        </section>
      </main>
      <footer>
        <a
          href="https://github.com/issamarida"
          target="_blank"
          rel="noopener noreferrer"
          >github</a
        ><span aria-hidden="true">·</span
        ><a
          href="https://www.linkedin.com/in/issam-arida/"
          target="_blank"
          rel="noopener noreferrer"
          >linkedin</a
        >
      </footer>
    </div>
    <dialog id="panel" aria-labelledby="panel-title">
      <div class="panel-top">
        <span id="panel-kicker"></span
        ><button id="close-panel" aria-label="Close destination">✕</button>
      </div>
      <div class="panel-content" id="panel-content"></div>
      <div class="panel-footer">
        <span id="panel-footer-note">A page from the archive.</span
        ><button id="return-world">BACK TO THE WOODLANDS <kbd>ESC</kbd></button>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
