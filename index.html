    <title>Lorenzo Hoffmann — Portfolio</title>

      name="description"
      content="Lorenzo Hoffmann — video editor and software engineer. A playable portfolio: walk a cyberpunk city or a fantasy kingdom to explore my career, code and video work."

    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        const stored = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          stored || (matchMedia("(prefers-color-scheme: light)").matches ? "fantasy" : "cyberpunk");
      } catch {
        document.documentElement.dataset.theme = "cyberpunk";
      }
    </script>
  </head>
